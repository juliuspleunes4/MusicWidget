name: MusicWidget
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    # >>> Change these two for your own account <<<
    BUNDLE_ID_BASE: com.pleunes.MusicWidget   # must match the App IDs registered at developer.apple.com
    DEVELOPMENT_TEAM: 4LF49CXB99
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MusicWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: MusicWidgetExtension
    entitlements:
      path: App/MusicWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(BUNDLE_ID_BASE).shared"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Music Widget
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_BASE)"
        PRODUCT_NAME: MusicWidget
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:   # Developer ID signing; the profile names are supplied by the release workflow
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROFILE_NAME)"

  MusicWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/MusicWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(BUNDLE_ID_BASE).shared"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Music Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_BASE).Widget"
        PRODUCT_NAME: MusicWidgetExtension
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "$(WIDGET_PROFILE_NAME)"
