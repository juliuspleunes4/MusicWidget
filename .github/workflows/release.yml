name: Release DMG

# Builds, signs (Developer ID), notarizes and publishes MusicWidget.dmg.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also create a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TEAM_ID: 4LF49CXB99

jobs:
  release:
    runs-on: macos-26   # Xcode 26 SDK, needed for Liquid Glass
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.APP_PROFILE_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.WIDGET_PROFILE_B64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          missing=0
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD APP_PROFILE_B64 WIDGET_PROFILE_B64 APPLE_ID APPLE_APP_PASSWORD SPOTIFY_CLIENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret/variable: $v"; missing=1; fi
          done
          exit $missing

      - name: Insert Spotify Client ID
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: sed -i '' "s/YOUR_SPOTIFY_CLIENT_ID/${SPOTIFY_CLIENT_ID}/" Shared/Config.swift

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Apple intermediate certificates (best effort; usually already trusted on the runner)
          for c in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$c.cer" -o "$RUNNER_TEMP/$c.cer" \
              && security import "$RUNNER_TEMP/$c.cer" -k "$KC" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          security find-identity -v -p codesigning "$KC"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_B64: ${{ secrets.APP_PROFILE_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.WIDGET_PROFILE_B64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {  # $1 = base64, $2 = env var name to export
            f="$RUNNER_TEMP/$2.provisionprofile"
            echo "$1" | base64 --decode > "$f"
            security cms -D -i "$f" > "$f.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$f.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$f.plist")
            cp "$f" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.provisionprofile"
            echo "$2=$name" >> "$GITHUB_ENV"
            echo "Installed profile: $name"
          }
          install_profile "$APP_PROFILE_B64" APP_PROFILE_NAME
          install_profile "$WIDGET_PROFILE_B64" WIDGET_PROFILE_NAME

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MusicWidget.xcodeproj -scheme MusicWidget -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/MusicWidget.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            APP_PROFILE_NAME="$APP_PROFILE_NAME" WIDGET_PROFILE_NAME="$WIDGET_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            | tee archive.log | tail -n 40

      - name: Export (Developer ID)
        run: |
          BASE=$(grep -m1 'BUNDLE_ID_BASE:' project.yml | awk '{print $2}')
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key><dict>
              <key>$BASE</key><string>$APP_PROFILE_NAME</string>
              <key>$BASE.Widget</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MusicWidget.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist"

      - name: Build DMG
        run: |
          mkdir -p dmg-root
          cp -R "$RUNNER_TEMP/export/MusicWidget.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Music Widget" -srcfolder dmg-root -ov -format UDZO MusicWidget.dmg
          codesign --sign "Developer ID Application" --timestamp MusicWidget.dmg

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit MusicWidget.dmg \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json | tee notary.json
          grep -q '"status" *: *"Accepted"' notary.json
          # Apple's ticket service occasionally drops the connection or lags behind; retry.
          for i in 1 2 3 4 5 6; do
            if xcrun stapler staple MusicWidget.dmg; then break; fi
            [ "$i" = 6 ] && exit 1
            echo "Stapling failed (attempt $i), retrying in 30s..."; sleep 30
          done
          xcrun stapler validate MusicWidget.dmg
          spctl --assess --type open --context context:primary-signature -v MusicWidget.dmg || true

      - uses: actions/upload-artifact@v4
        with:
          name: MusicWidget-dmg
          path: MusicWidget.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MusicWidget.dmg --title "Music Widget $GITHUB_REF_NAME" --generate-notes
