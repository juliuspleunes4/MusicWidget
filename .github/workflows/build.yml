name: Build

# Compiles the app and widget on a macOS machine hosted by GitHub, so compile errors show up
# without needing a Mac of your own. Signing is disabled; this only checks that the code builds.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project MusicWidget.xcodeproj \
            -scheme MusicWidget \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 80
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
